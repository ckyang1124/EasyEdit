# Model
device: cuda

name: Qwen/Qwen2-Audio-7B-Instruct
model_name: Qwen/Qwen2-Audio-7B-Instruct
model_class: Qwen2AudioForConditionalGeneration
tokenizer_class: AutoProcessor
tokenizer_name: Qwen/Qwen2-Audio-7B-Instruct
inner_params:
- language_model.model.layers.29.mlp.gate_proj.weight
- language_model.model.layers.29.mlp.up_proj.weight
- language_model.model.layers.29.mlp.down_proj.weight
- language_model.model.layers.30.mlp.gate_proj.weight
- language_model.model.layers.30.mlp.up_proj.weight
- language_model.model.layers.30.mlp.down_proj.weight
- language_model.model.layers.31.mlp.gate_proj.weight
- language_model.model.layers.31.mlp.up_proj.weight
- language_model.model.layers.31.mlp.down_proj.weight


# Method
alg: MEND
lr: 1e-6
edit_lr: 1e-4
lr_lr: 1e-4
seed: 42
cedit: 0.1
iedit: 0.1
cloc: 1.0
cbase: 1.0
dropout: 0.0
train_base: False
no_grad_layers: null
one_sided: False
n_hidden: 1
hidden_dim: null
init: id
norm: True
combine: True
x_only: False
delta_only: False
act: relu
rank: 1920
mlp_class: IDMLP
shared: True
archive: null
model_parallel: True

# Train
batch_size: 1
model_save_pt: 5000
silent: False
# max_epochs: 1
max_iters: 3600 #50000
log_interval: 50
eval_log_interval: 50
final_eval: True
val_interval: 900
early_stop_patience: 5000 #10000
early_stop_key: "loss/total_edit_val"
eval_only: False
half: False
debug: False # TODO: change to False for real training
save: True
verbose: True

val_batch_size: 1
accumulate_bs: 2
val_steps: 500 # only for debug
opt: Adam
grad_clip: 100.

# Output
results_dir: ~/data/lalm-knowledge-editing/EasyEdit/results/MEND/Qwen2Audio_no_label_all

# Multimodal
exact_match: False #True
# freeze_qformer: False
# qformer_checkpoint: hugging_cache/blip2_pretrained_opt2.7b.pth
# qformer_name_or_path: bert-base-uncased
# state_dict_file: hugging_cache/eva_vit_g.pth

# Audio
cache_dir: ./.cache
audio_root: ~/data/lalm-knowledge-editing/dataset/audio_wavs

# Weights and Biases
wandb_enabled: True
wandb_project: LALM-Knowledge-Editing_MEND_Qwen2Audio